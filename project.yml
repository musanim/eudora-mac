# XcodeGen spec for the Phase 3 GUI.
#
#   brew install xcodegen        # one-time, if not present
#   xcodegen generate            # run from ~/ClaudeProjects/Eudora
#   open EudoraApp.xcodeproj     # ⌘R to build & run
#
# The app target links the existing local SwiftPM package (EudoraMac) and its
# EudoraStore / EudoraSearch products — so the GUI binds to the same interop and
# search layer the CLI and tests use. Regenerating the project never touches the
# package sources; edit code freely and re-run `xcodegen generate` only when the
# file layout or settings change.

name: EudoraApp

options:
  bundleIdPrefix: com.stephen.eudora
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  EudoraMac:
    path: EudoraMac

targets:
  EudoraApp:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: EudoraApp/Sources
      # Asset catalog: the Eudora 7 column-header icons (ColumnStatus,
      # ColumnAttachment). Adding files here needs `xcodegen generate`.
      - path: EudoraApp/Resources
      # The launch splash, copied straight into the bundle from its source in
      # `assets/` — the single source of truth. `SplashWindow` loads it by URL
      # (Bundle.main.url), so there is no imageset copy to keep in sync. Edit
      # `assets/EudoraSplash8.png` and rebuild; no re-sync, no `xcodegen`.
      - path: assets/EudoraSplash8.png
        buildPhase: resources
    dependencies:
      - package: EudoraMac
        product: EudoraStore
      - package: EudoraMac
        product: EudoraSearch
      - package: EudoraMac
        product: EudoraNet
      - package: EudoraMac
        product: EudoraRichText
    settings:
      base:
        PRODUCT_NAME: Eudora
        PRODUCT_BUNDLE_IDENTIFIER: com.stephen.eudora.app
        # The Dock/Finder icon: the gold 8 lifted out of the splash art. Named
        # rather than defaulted — without this, Xcode compiles the appiconset
        # into Assets.car and then doesn't reference it, so the build succeeds
        # and the app still shows the blank generic icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: EudoraApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.3.3"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.7"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        # Not sandboxed: this app reads a Eudora tree in place from an arbitrary
        # path in your home directory; sandboxing it later means adding the
        # user-selected-file entitlement + security-scoped bookmarks.
        #
        # Signed with a stable identity, NOT ad-hoc ("-"). Ad-hoc gives the binary
        # a new signature every build, so the Keychain's "Always Allow" grant for
        # the SMTP password never sticks and re-prompts on each launch. A stable
        # identity fixes that.
        #
        # **Developer ID, so the app can be given to other people.** It used to be
        # signed with an "Apple Development" cert, which is a LOCAL identity: the
        # app ran here and was refused on anyone else's Mac, reported to them as
        # "unsigned". Distribution outside the App Store needs a Developer ID
        # Application certificate (team S59385AX28) plus notarization, which is a
        # different credential from the Apple Distribution cert the iOS apps use —
        # same membership, different purpose. See scripts/release.sh.
        #
        # Still referenced by SHA-1 fingerprint (from
        # `security find-identity -v -p codesigning`) rather than by name+team,
        # and DEVELOPMENT_TEAM is still deliberately empty. Naming the team broke
        # both manual and automatic signing before, because this account isn't
        # signed into Xcode ▸ Accounts; by-fingerprint needs no Apple account and
        # no provisioning profile for a no-sandbox Mac app. Changing that is not
        # an improvement waiting to be made.
        # If the cert is ever renewed the fingerprint changes; re-run the command
        # above and paste the new hash here.
        #
        # Hardened runtime is ON because notarization requires it. No entitlements
        # are needed: nothing here loads third-party dylibs, and network, Keychain
        # and unsandboxed file access are all unaffected by it.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "104FFC817F2CD3D913D2D3E2C2ABAFBBEBDBC116"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
      configs:
        # Release-only, and both are here because Apple's notary service rejected
        # the first submission for exactly these two things. They are Release-only
        # on purpose — see the reason attached to each.
        Release:
          # Xcode passes --timestamp for archive/export but not for a plain
          # `xcodebuild build`, and notarization requires a secure timestamp.
          # Not in Debug: timestamping contacts Apple's server on every signing,
          # so it would put a network round trip in every incremental build.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Xcode injects com.apple.security.get-task-allow — the entitlement
          # that lets a debugger attach — into ordinary builds, and notarization
          # refuses any binary carrying it. Must stay YES for Debug or the
          # debugger can no longer attach to your own app.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

# A shared scheme so `xcodegen generate` always emits the app scheme and Xcode
# keeps it selected (rather than defaulting to the eudora-spike CLI target).
schemes:
  EudoraApp:
    build:
      targets:
        EudoraApp: all
    run:
      config: Debug
      # Silence the unified-logging chatter Xcode echoes from Apple frameworks —
      # the tcp_input RST lines from Network.framework, the WKWebView WebContent
      # sandbox-denial flood, the SwiftUI ProgressView min/max assertion, etc.
      # None of it is Eudora's; all of it is expected. This mutes os_log/NSLog
      # from the frameworks while leaving our own `print()` diagnostics (PerfLog)
      # intact, since those go to stdout. Remove it if you ever need to see a
      # framework's own os_log output while debugging.
      environmentVariables:
        OS_ACTIVITY_MODE: disable
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
